<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASA-Punk 太阳系</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0e141f;color:#e8e8e8;font-family:'Jura','Segoe UI',sans-serif;user-select:none}
:root{--bg-navy:#0e141f;--line-color:#3b4e6b;--const-red:#c82337;--const-orange:#e06236;--const-yellow:#d7ab61;--const-blue:#2f4c79;--text-white:#e8e8e8;--text-dim:#6d7d8c}
#topo{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,0.006) 3px,rgba(255,255,255,0.006) 4px),radial-gradient(ellipse at 50% 0%,rgba(20,40,80,0.1) 0%,transparent 60%),radial-gradient(ellipse at 30% 80%,rgba(60,30,60,0.05) 0%,transparent 50%)}
.transition-curtain{position:fixed;top:0;left:-50%;width:200%;height:100%;z-index:9999;pointer-events:none;display:flex;transform:skewX(-15deg) translateX(-100%)}
.curtain-col{flex:1;height:100%;transform:scaleX(1.1)}.c1{background:var(--const-red)}.c2{background:var(--const-orange)}.c3{background:var(--const-yellow)}.c4{background:var(--const-blue)}
.transition-curtain.start-covered{transform:skewX(-15deg) translateX(0%)}
.curtain-exit{animation:wipe-in 0.8s cubic-bezier(0.7,0,0.3,1) forwards}
.curtain-intro{animation:wipe-out 0.8s cubic-bezier(0.7,0,0.3,1) forwards}
@keyframes wipe-in{from{transform:skewX(-15deg) translateX(-100%)}to{transform:skewX(-15deg) translateX(0%)}}
@keyframes wipe-out{from{transform:skewX(-15deg) translateX(0%)}to{transform:skewX(-15deg) translateX(100%)}}
nav{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;background:rgba(14,20,31,0.95);border-bottom:1px solid var(--line-color)}
nav::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--const-red),var(--const-orange),var(--const-yellow),var(--const-blue))}
.logo{font-size:18px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--const-yellow)}
.logo span{color:var(--const-yellow);font-weight:300;letter-spacing:1px;font-size:11px;text-transform:none;opacity:0.6}
.nav-buttons{display:flex;gap:0}
.nav-btn{padding:6px 18px;border:none;background:transparent;color:var(--text-dim);font-family:'Jura',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;letter-spacing:1px;border-right:1px solid rgba(255,255,255,0.04)}
.nav-btn:last-child{border-right:none}.nav-btn:hover{color:var(--text-white)}
.nav-btn.active{color:var(--const-orange);background:rgba(224,98,54,0.06)}
.page{position:relative;z-index:1;display:none;width:100%;height:calc(100vh - 52px)}
.page.active{display:flex;flex-direction:column}
#main-canvas{flex:1;width:100%;display:block;cursor:crosshair}
#main-canvas:active{cursor:grabbing}
#page-switcher{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:0;padding:0;background:transparent;backdrop-filter:none;border:none}
#page-switcher .nav-btn{border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:8px 18px;background:rgba(14,20,31,0.75);color:var(--text-dim);font-family:'Jura',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.2s;letter-spacing:1px;backdrop-filter:blur(8px);margin:0 6px}
#page-switcher .nav-btn:hover{border-color:var(--const-blue);color:var(--text-white);background:rgba(14,20,31,0.9)}
#page-switcher .nav-btn.active{border-color:var(--const-orange);color:var(--const-orange);background:rgba(224,98,54,0.1)}
#page-switcher .sw-sep{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--line-color),transparent)}
.controls-bar{display:flex;align-items:center;padding:8px 16px;background:rgba(14,20,31,0.92);border-top:1px solid var(--line-color);flex-wrap:wrap;gap:4px;position:relative}
.controls-bar::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--const-blue),transparent)}
.ctrl-group{display:flex;align-items:center;gap:4px;padding:0 6px}
.ctrl-sep{width:1px;height:18px;background:var(--line-color);margin:0 4px}
.ctrl-label{font-family:'Roboto Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-right:4px}
.ctrl-btn{padding:3px 10px;border:1px solid transparent;background:transparent;font-family:'Jura',sans-serif;font-size:12px;font-weight:500;color:var(--text-dim);cursor:pointer;transition:all 0.15s;letter-spacing:0.5px}
.ctrl-btn:hover{border-color:var(--const-blue);color:var(--text-white)}
.ctrl-btn.active-btn{border-color:var(--const-orange);color:var(--const-orange)}
.ctrl-btn.mini{padding:2px 6px;font-size:14px}
#speed-display{min-width:24px;text-align:center;font-family:'Roboto Mono',monospace;font-size:13px;font-weight:500;color:var(--const-orange)}
#angle-display{font-family:'Roboto Mono',monospace;font-size:10px;color:var(--text-dim);min-width:40px;text-align:center}
.zoom-display{margin-left:auto;font-family:'Roboto Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:0.5px;padding:2px 8px;border:1px solid rgba(255,255,255,0.04)}
.view-note{padding:2px 16px 4px;text-align:center;font-family:'Roboto Mono',monospace;font-size:9px;color:rgba(255,255,255,0.08);letter-spacing:1px}
#tooltip{position:fixed;z-index:100;display:none;background:rgba(14,20,31,0.95);border:1px solid var(--line-color);padding:12px 16px;font-family:'Roboto Mono',monospace;font-size:11px;pointer-events:none;min-width:160px;box-shadow:6px 6px 0 rgba(0,0,0,0.3)}
#tooltip::before{content:'> 数据';position:absolute;top:-10px;right:8px;font-size:8px;color:var(--const-orange);letter-spacing:2px}
#tooltip .tt-name{font-family:'Jura',sans-serif;font-size:18px;font-weight:700;letter-spacing:1px}
#tooltip .tt-en{color:var(--text-dim);font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-top:1px}
#tooltip .tt-divider{height:0;border-top:1px solid var(--line-color);margin:8px 0 6px}
#tooltip .tt-row{color:var(--text-dim);font-size:10px;margin-top:3px;display:flex;justify-content:space-between;gap:12px}
#tooltip .tt-row span{color:var(--text-white);font-weight:500}
#planet-overlay{position:fixed;inset:0;z-index:50;display:none;background:var(--bg-navy);pointer-events:auto}
#planet-overlay.active{display:block}
.right-dock{position:absolute;top:24px;right:24px;display:flex;flex-direction:column;align-items:flex-end;z-index:10;pointer-events:auto}
.header-block{border-right:3px solid var(--const-orange);padding-right:20px;margin-bottom:30px;display:flex;flex-direction:column;align-items:center;text-align:center}
.header-block h1{font-size:36px;letter-spacing:6px;margin:0;line-height:1;text-transform:uppercase;font-weight:700}
.header-block .sub-text{font-family:'Roboto Mono',monospace;font-size:10px;color:var(--const-yellow);letter-spacing:1px;margin-top:6px;white-space:nowrap}
.header-block .sub-text b{color:var(--text-white)}
.data-block{text-align:left;border-right:1px solid rgba(255,255,255,0.12);padding-right:20px;font-family:'Roboto Mono',monospace;font-size:10px;line-height:2.2;color:var(--text-dim);align-self:flex-end;width:fit-content;max-width:350px}
.data-row span{color:var(--text-white);font-weight:500}
.data-row .alert{color:var(--const-orange);font-weight:700}.data-row .footer{color:var(--const-yellow)}
.system-monitor-container{position:absolute;left:24px;bottom:24px;z-index:10;pointer-events:auto;cursor:pointer}
.system-monitor-body{position:relative;width:200px;height:200px;display:flex;justify-content:center;align-items:center}
.sun-marker{position:absolute;width:16px;height:16px;background:#fff5cc;border-radius:50%;box-shadow:0 0 15px #fff5cc;z-index:10;display:flex;justify-content:center;align-items:center}
.orbit-path{position:absolute;border-radius:50%;border:1px dashed var(--line-color);opacity:0.4;pointer-events:none}
.orbit-path.orbit-active{border-color:rgba(224,98,54,0.6)!important;opacity:0.8!important;border-style:solid}
.planet-container{position:absolute;width:100%;height:100%;animation:rotateOrbit linear infinite;pointer-events:none}
.planet-marker{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);border-radius:50%}
@keyframes rotateOrbit{100%{transform:rotate(360deg)}}
.o-mercury{width:28px;height:28px}.c-mercury{animation-duration:4s}.p-mercury{width:3px;height:3px;background:#aaa;left:calc(50% - 14px)}
.o-venus{width:46px;height:46px}.c-venus{animation-duration:8s}.p-venus{width:4px;height:4px;background:#d4af37;left:calc(50% - 23px)}
.o-earth{width:70px;height:70px}.c-earth{animation-duration:14s}.p-earth{width:4px;height:4px;background:#4b70dd;left:calc(50% - 35px)}
.o-mars{width:90px;height:90px}.c-mars{animation-duration:22s}.p-mars{width:4px;height:4px;background:#c82337;left:calc(50% - 45px)}
.o-jupiter{width:130px;height:130px;opacity:0.3}.c-jupiter{animation-duration:45s}.p-jupiter{width:10px;height:10px;background:#c78848;left:calc(50% - 65px)}
.o-saturn{width:165px;height:165px;opacity:0.3}.c-saturn{animation-duration:75s}.p-saturn{width:8px;height:8px;background:#e0d0a0;left:calc(50% - 82.5px);box-shadow:0 0 0 2px rgba(0,0,0,0.5),0 0 0 4px rgba(224,208,160,0.3)}
.o-uranus{width:200px;height:200px;opacity:0.2}.c-uranus{animation-duration:100s}.p-uranus{width:6px;height:6px;background:#7fffd4;left:calc(50% - 100px)}
.o-neptune{width:235px;height:235px;opacity:0.2}.c-neptune{animation-duration:140s}.p-neptune{width:6px;height:6px;background:#3e54e8;left:calc(50% - 117.5px)}
.target-reticle{position:absolute;z-index:20;pointer-events:none;top:50%;left:50%;width:14px;height:14px;transform:translate(-50%,-50%)}
.target-reticle.large{width:24px;height:24px}
.reticle-corner{position:absolute;width:4px;height:4px;border-color:var(--const-orange);border-style:solid}
.rc-tl{top:0;left:0;border-width:1px 0 0 1px}.rc-tr{top:0;right:0;border-width:1px 1px 0 0}
.rc-bl{bottom:0;left:0;border-width:0 0 1px 1px}.rc-br{bottom:0;right:0;border-width:0 1px 1px 0}
.scanner-trail{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;pointer-events:none;z-index:1;background:conic-gradient(from 90deg,transparent 0deg,transparent 315deg,rgba(47,76,121,0.35) 360deg);-webkit-mask:radial-gradient(transparent 10px,#000 12px,#000 99%,transparent 100%);mask:radial-gradient(transparent 10px,#000 12px,#000 99%,transparent 100%);animation:scanSys 12s linear infinite}
.scanner-line-sys{position:absolute;width:50%;height:1px;background:linear-gradient(to right,transparent,var(--const-blue));top:50%;left:50%;transform-origin:left center;animation:scanSys 12s linear infinite;opacity:0.9;z-index:11}
@keyframes scanSys{100%{transform:rotate(360deg)}}
.monitor-label{position:absolute;font-family:'Roboto Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:1px;line-height:20px}
.label-top{top:-22px;left:0;width:100%;color:var(--const-yellow);text-align:center;white-space:nowrap}
.label-bottom{bottom:-22px;left:0;width:100%;text-align:center;white-space:nowrap}
.vertical-controls{position:absolute;right:20px;bottom:40px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto}
.vertical-controls .v-label{font-family:'Roboto Mono',monospace;font-size:9px;color:var(--const-orange);letter-spacing:1px;writing-mode:vertical-lr;text-orientation:mixed;margin-top:4px}
.v-track{width:2px;height:120px;background:var(--line-color);position:relative;border-radius:1px;cursor:pointer}
.v-track-fill{position:absolute;bottom:0;width:100%;height:50%;background:var(--const-orange);border-radius:1px}
.v-thumb{position:absolute;left:50%;transform:translate(-50%,50%);width:14px;height:14px;background:var(--bg-navy);border:1.5px solid var(--const-orange);bottom:50%;cursor:pointer;z-index:2}
.v-thumb:hover{background:var(--const-orange)}
@media(max-width:700px){
  nav{padding:0 12px;height:44px}.logo{font-size:14px;letter-spacing:2px}.logo span{display:none}
  .nav-btn{font-size:11px;padding:4px 10px}.controls-bar{padding:6px 8px}.ctrl-btn{font-size:10px;padding:2px 6px}.ctrl-label{display:none}
  .page{height:calc(100vh - 44px)}
  #page-switcher{bottom:60px}
  #page-switcher .nav-btn{font-size:10px;padding:5px 10px;margin:0 3px}
  #page-switcher .sw-sep{width:20px}
  .header-block h1{font-size:24px}.data-block{font-size:9px;max-width:260px}
  .system-monitor-body{width:140px;height:140px}.right-dock{top:12px;right:12px}
  .system-monitor-container{left:12px;bottom:12px}
}
/* === Enhanced Detail Page Styles === */
.brand-stripe{position:absolute;z-index:15;pointer-events:none}
.bs-top{top:0;left:0;right:0;height:3px;background:var(--const-blue);opacity:0.7}
.bs-right{right:0;top:0;bottom:0;width:3px;background:var(--const-red);opacity:0.7}
.bs-bottom{bottom:0;left:0;right:0;height:3px;background:var(--const-orange);opacity:0.7}
.bs-left{left:0;top:0;bottom:0;width:3px;background:var(--const-yellow);opacity:0.7}
#topo-detail{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0.35}
#detail-canvas{z-index:2;position:relative}
.system-monitor-body.detail-mode{width:260px;height:260px}
.monitor-click-hint{position:absolute;bottom:-38px;left:0;width:100%;text-align:center;font-family:'Roboto Mono',monospace;font-size:8px;color:rgba(255,255,255,0.18);letter-spacing:2px;pointer-events:none}
.zoom-slider-container{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:12;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.zoom-track{width:320px;height:3px;background:var(--line-color);position:relative;border-radius:2px;cursor:pointer}
.zoom-track-fill{position:absolute;left:0;top:0;height:100%;background:var(--const-orange);border-radius:2px;transition:width 0.1s}
.zoom-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;background:var(--bg-navy);border:2px solid var(--const-orange);border-radius:50%;cursor:pointer;transition:left 0.1s;z-index:2}
.zoom-thumb:hover{background:var(--const-orange)}
.zoom-ticks{display:flex;justify-content:space-between;width:320px;padding:0 4px}
.zoom-tick{font-family:'Roboto Mono',monospace;font-size:8px;color:var(--text-dim);letter-spacing:0.5px;position:relative;cursor:pointer;z-index:1}.zoom-tick::before{pointer-events:none}
.zoom-tick::before{content:'';position:absolute;top:-8px;left:50%;width:1px;height:4px;background:var(--line-color);transform:translateX(-50%)}
.zoom-label{font-family:'Roboto Mono',monospace;font-size:9px;color:var(--const-orange);letter-spacing:2px;text-transform:uppercase}
.data-block.terminal{text-align:left;border-right:1px solid rgba(255,255,255,0.12);padding-right:20px;font-family:'Roboto Mono',monospace;font-size:11px;line-height:2.4;color:var(--text-dim);align-self:flex-end;width:fit-content;max-width:380px}
.terminal-line{border-left:1px solid rgba(255,255,255,0.06);padding-left:12px;margin:1px 0;opacity:0;transition:opacity 0.4s ease}
.terminal-line.visible{opacity:1}
.terminal-line .key{color:var(--text-dim)}
.terminal-line .val{color:var(--text-white);font-weight:500}
.terminal-line .val.alert{color:var(--const-orange);font-weight:700}
.terminal-line .val.warn{color:var(--const-yellow);font-weight:700}
.terminal-line .val.pos{color:#5baf6b}
.terminal-sep{border:none;border-top:1px solid rgba(255,255,255,0.06);margin:8px 0 6px}
.header-block h1.designation{font-size:42px;letter-spacing:8px}
.header-block .planet-code{font-size:14px;letter-spacing:6px;font-weight:300;opacity:0.5;color:var(--text-dim);text-transform:uppercase}
.header-block .orbital-index{font-family:'Roboto Mono',monospace;font-size:10px;color:var(--const-yellow);letter-spacing:2px;margin-top:2px}
.telemetry-display{position:absolute;top:28px;left:28px;z-index:12;font-family:'Roboto Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:1px;line-height:1.9;pointer-events:none}
.telemetry-row{display:flex;gap:12px}
.telemetry-row .tl-key{color:rgba(255,255,255,0.2);min-width:36px}
.telemetry-row .tl-val{color:var(--const-orange)}
.telemetry-row .tl-val.dim{color:var(--text-dim)}
@media(max-width:700px){
  .zoom-slider-container{bottom:24px}.zoom-track{width:220px}.zoom-ticks{width:220px}
  .telemetry-display{top:12px;left:12px;font-size:8px}.header-block h1.designation{font-size:28px}
  .data-block.terminal{font-size:9px;max-width:260px}
  .system-monitor-body.detail-mode{width:180px;height:180px}
}
</style>
</head>
<body>
<div id="topo"></div>
<div class="transition-curtain start-covered" id="curtain">
  <div class="curtain-col c1"></div><div class="curtain-col c2"></div>
  <div class="curtain-col c3"></div><div class="curtain-col c4"></div>
</div>

<nav>
  <div class="logo">☀ 太阳系 <span>· 探索站</span></div>
</nav>

<div id="tooltip">
  <div class="tt-name"></div><div class="tt-en"></div>
  <div class="tt-divider"></div><div class="tt-row"></div><div class="tt-row"></div><div class="tt-row"></div>
</div>

<div id="main-view" class="page active">
  <canvas id="main-canvas"></canvas>
  <div class="controls-bar">
    <div class="ctrl-group" id="speed-group">
      <span class="ctrl-label">速度</span>
      <button class="ctrl-btn mini" onclick="adjSpeed(-1)">−</button>
      <span id="speed-display">1×</span>
      <button class="ctrl-btn mini" onclick="adjSpeed(1)">+</button>
    </div>
    <div class="ctrl-sep" id="sep1"></div>
    <div class="ctrl-group" id="tilt-group">
      <span class="ctrl-label">倾角</span>
      <span id="angle-display">0°</span>
    </div>
    <div class="ctrl-sep" id="sep2"></div>
    <div class="ctrl-group">
      <button id="btn-orbits" class="ctrl-btn active-btn" onclick="view.toggleOrbits()">轨道线</button>
      <button id="btn-labels" class="ctrl-btn active-btn" onclick="view.toggleLabels()">标签</button>
      <button id="btn-sinfo" class="ctrl-btn active-btn" onclick="view.toggleInfo()">数据</button>
    </div>
    <div class="ctrl-sep"></div>
    <div class="ctrl-group">
      <button class="ctrl-btn" onclick="view.resetCamera()">重置</button>
    </div>
    <span class="zoom-display" id="zoom-info">×1.0</span>
  </div>
  <div id="view-note" class="view-note">点击天体查看详情 · 右键倾角 · 右下拖动条缩放</div>
  <div class="vertical-controls" id="main-zoom-v" style="pointer-events:auto">
    <div class="v-track" id="mz-vtrack"><div class="v-track-fill" id="mz-vfill" style="height:50%"></div><div class="v-thumb" id="mz-vthumb" style="bottom:50%"></div></div>
    <div class="v-label">缩放</div>
  </div>
  <div id="page-switcher">
    <button class="nav-btn active" data-page="compare" onclick="switchPage('compare')">📏 大小</button>
    <div class="sw-sep"></div>
    <button class="nav-btn" data-page="arrange" onclick="switchPage('arrange')">📐 距离</button>
    <div class="sw-sep"></div>
    <button class="nav-btn" data-page="orbit" onclick="switchPage('orbit')">🌌 轨道</button>
  </div>
</div>

<div id="planet-overlay">
  <canvas id="detail-canvas"></canvas>
  <div id="planet-ui-root"></div>
</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
<script>
const PLANETS = [
  { key:'sun',     name:'太阳', nameEn:'SUN',     radiusKm:695508,  distanceAU:0,    ecc:0,      color:'#d7ab61', periodDays:0,     tilt:0, moons:[] },
  { key:'mercury', name:'水星', nameEn:'MERCURY', radiusKm:2439.7,  distanceAU:0.387,ecc:0.2056, color:'#8a8a8a', periodDays:87.97,  tilt:0.03, moons:[] },

function showTip(cx,cy,p){
  const isSun=p.distanceAU===0;

  tE.style.display='block';tE.textContent='['+p.nameEn+']';tE.style.color='rgba(255,255,255,0.25)';
  t1.style.display='flex';t2.style.display='flex';t3.style.display='flex';
  t1.innerHTML=`直径<span>${(p.radiusKm*2).toLocaleString()} km</span>`;
  t2.innerHTML=isSun?`质量<span>×333,000 地球</span>`:`比例<span>×${(p.radiusKm/ER).toFixed(2)} 地球</span>`;
  if(p.moons&&p.moons.length>0){t3.innerHTML=`卫星<span>${p.moons.length} 颗</span>`;}else{t3.style.display='none';}
  tip.style.display='block';
  let l=cx+16,t=cy+16;const tw=tip.offsetWidth,th=tip.offsetHeight;
  if(l+tw>innerWidth-10)l=cx-tw-16;if(t+th>innerHeight-10)t=cy-th-16;

}
function hideTip(){tip.style.display='none';}

function hexToRgb(h){const v=parseInt(h.replace('#',''),16);return[(v>>16)&255,(v>>8)&255,v&255]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(c=>Math.round(Math.max(0,Math.min(255,c))).toString(16).padStart(2,'0')).join('')}
function lighten(h,a){const[r,g,b]=hexToRgb(h);const f=a/100;return rgbToHex(r+(255-r)*f,g+(255-g)*f,b+(255-b)*f)}
function darken(h,a){const[r,g,b]=hexToRgb(h);const f=a/100;return rgbToHex(r*(1-f),g*(1-f),b*(1-f))}

class CameraView{
  constructor(canvasId,zoomId){
    this.canvas=document.getElementById(canvasId);this.ctx=this.canvas.getContext('2d');
    this.zoomId=zoomId;this.zoom=1;this.panX=0;this.panY=0;this._up=false;this._drag=false;
    this._dsx=0;this._dsy=0;this._lpx=0;this._lpy=0;
    this.hovered=null;this.dpr=1;this.W=0;this.H=0;this.running=false;this.rid=null;
    this._rotating=false;this._rotStartX=0;this._rotStartY=0;this._rotLastX=0;this._rotLastY=0;
    this._clickOnHover=false;
  }
  _sz(){return{w:this.ctx.canvas.parentElement.clientWidth,h:this.ctx.canvas.parentElement.clientHeight}}
  resize(){
    const{w,h}=this._sz();this.dpr=Math.min(devicePixelRatio||1,2);
    this.canvas.style.width=w+'px';this.canvas.style.height=h+'px';
    this.canvas.width=Math.round(w*this.dpr);this.canvas.height=Math.round(h*this.dpr);
    this.W=w;this.H=h;this.cx=w/2;this.cy=h/2;
    if(!this._up){this.zoom=1;this.panX=0;this.panY=0;}
    this.ctx.setTransform(1,0,0,1,0,0);this.ctx.scale(this.dpr,this.dpr);
  }
  bindCamera(onClickBody){
    window.addEventListener('resize',()=>{this._up=false;this.resize();});
        this.canvas.addEventListener('contextmenu',e=>{e.preventDefault();});
    this.canvas.addEventListener('mousedown',e=>{
      if(this.hovered&&e.button===0){this._clickOnHover=true;return;}
      if(e.button===2){this._rotating=true;this._rotStartX=e.clientX;this._rotStartY=e.clientY;this._rotLastX=e.clientX;this._rotLastY=e.clientY;return;}
    });
    window.addEventListener('mousemove',e=>{
      if(this._rotating){const dx=e.clientX-this._rotLastX;const dy=e.clientY-this._rotLastY;this._rotLastX=e.clientX;this._rotLastY=e.clientY;if(Math.abs(dx)>1||Math.abs(dy)>1)this._onRotate(dx,dy);this._up=true;return;}
      const r=this.canvas.getBoundingClientRect();
      if(document.getElementById('planet-overlay').style.display==='block'){hideTip();return;}
      this._onHover((e.clientX-r.left)*(this.W/r.width),(e.clientY-r.top)*(this.H/r.height),e.clientX,e.clientY);
    });
    window.addEventListener('mouseup',e=>{
      if(this._clickOnHover&&this.hovered&&!this._rotating){this._clickOnHover=false;if(onClickBody)onClickBody(this.hovered);}
      this._drag=false;this._rotating=false;this._clickOnHover=false;
    });
    this.canvas.addEventListener('mouseleave',()=>{this._drag=false;this._rotating=false;this.hovered=null;hideTip();});
    
  }
  _zoom(dir,cx,cy){this._zoomRaw(1+dir*0.12,cx,cy);}
  _zoomRaw(f,cx,cy){
    const nz=Math.max(0.02,Math.min(100,this.zoom*f));
    const r=this.canvas.getBoundingClientRect();
    const mx=(cx-r.left)*(this.W/r.width),my=(cy-r.top)*(this.H/r.height);
    const s=this._ss();const wx=(mx-this.cx-this.panX)/(s*this.zoom),wy=(my-this.cy-this.panY)/(s*this.zoom);
    this.zoom=nz;this.panX=mx-this.cx-wx*s*this.zoom;this.panY=my-this.cy-wy*s*this.zoom;
    this._up=true;this._uzl();
  }
  _ss(){return 1;}_onHover(mx,my,cx,cy){}_onRotate(dx,dy){}_uzl(){}
  start(){if(this.running)return;this.running=true;const loop=n=>{if(!this.running)return;this._ds();this.rid=requestAnimationFrame(loop);};this.rid=requestAnimationFrame(loop);}
  stop(){this.running=false;if(this.rid){cancelAnimationFrame(this.rid);this.rid=null;}}
  setZoomPercent(pct){
    const z=Math.pow(4,pct/100)*0.25;this.zoom=z;this._up=true;this._uzl();
  }
  resetCamera(){this._up=false;this.zoom=1;this.panX=0;this.panY=0;this._uzl();}
}

class SolarView extends CameraView{
  constructor(){
    super('main-canvas','zoom-info');this.mode='compare';
    this.showLabels=true;this.showInfo=true;this.showOrbits=true;
    this.speed=1;this.time=0;this.viewTilt=0;this._satTime=0;
    this.bodies=PLANETS.map(p=>({...p}));
    this.planets=PLANETS.filter(p=>p.distanceAU>0).map(p=>({...p,angle:Math.random()*Math.PI*2,moons:p.moons.map(m=>({...m,angle:Math.random()*Math.PI*2}))}));
    this._animProgress=-1;this._animFrom=[];this._animTo=[];this._dashOffset=0;
    this._flyProgress=-1;this._flyFrom=[];this._flyTo=[];this._sscale=1;

  }
  _calcScales(w,h){const maxAU=30.069;const t=(w-60)/maxAU;const m=0.387*t*0.85/SR;return{sizeBase:Math.max(0.05,Math.min(m,4)),distScale:t};}
  resize(){super.resize();const s=this._calcScales(this.W,this.H);this.sizeBase=s.sizeBase;this._distScale=s.distScale;if(!this._up){this.zoom=1;this.viewTilt=0;if(this.mode==='arrange'){this.panX=-this.cx+30;this.panY=0;}else{this.panX=0;this.panY=0;}}this._sscale=this._distScale;}
  _ss(){return this._sscale;}
  _br(km){return Math.max(km/ER*this.sizeBase*this.zoom,0.5);}
  _obr(p){return Math.max(p.radiusKm/ER*this.sizeBase*this.zoom,0.25);}
  _sr(){const raw=SR*this.sizeBase*this.zoom;const mercOrbit=0.387*this._distScale*this.zoom;return Math.min(raw,mercOrbit*0.2);}
  _obp(p){const px=this._distScale*this.zoom;const a=p.distanceAU*px,e=p.ecc,b=a*Math.sqrt(1-e*e),tf=1-this.viewTilt/(Math.PI/2),cA=Math.cos(p.angle),sA=Math.sin(p.angle);return{x:this.cx+this.panX+a*(cA-e),y:this.cy+this.panY+b*sA*tf};}
  _eqLayout(){const count=this.bodies.length;const avail=this.W-60;const totalDiamER=PLANETS.reduce((s,p)=>s+p.radiusKm/ER*2,0);const maxBase=(avail-(count-1)*8)/totalDiamER;const eqS=Math.min(this.W/250,Math.max(0.5,maxBase))*0.7;const items=this.bodies.map(b=>({p:b,r:Math.max(b.radiusKm/ER*eqS*this.zoom,0.8)}));const bodiesW=items.reduce((s,it)=>s+it.r*2,0);const gap=Math.max(8,(avail-bodiesW)/(count-1));const totalW=bodiesW+(count-1)*gap;const baseX=this.cx+this.panX-totalW/2;let cx=baseX;const sy=this.cy+this.panY;for(const it of items){it.x=cx+it.r;cx+=it.r*2+gap;it.y=sy;}return items;}
  _realLayout(){const sx=this.cx+this.panX,sy=this.cy+this.panY,p=this._distScale*this.zoom;return this.bodies.map(b=>({p:b,x:sx+b.distanceAU*p,y:sy,r:this._br(b.radiusKm)}));}
  _orbitLayout(){const sx=this.cx+this.panX,sy=this.cy+this.panY;return[{p:PLANETS[0],x:sx,y:sy,r:this._sr()},...this.planets.map(p=>{const q=this._obp(p);return{p,x:q.x,y:q.y,r:this._obr(p)}})];}
  _layout(){
    if(this._flyProgress>=0){const t=this._flyProgress;const e=1-(1-t)*(1-t);return this._flyFrom.map((f,i)=>{const to=this._flyTo[i];return{p:to.p,x:f.x+(to.x-f.x)*e,y:f.y+(to.y-f.y)*e,r:f.r+(to.r-f.r)*e};});}
    if(this._animProgress>=0){const t=this._animProgress;const e=1-(1-t)*(1-t);return this._animFrom.map((f,i)=>{const to=this._animTo[i];return{p:to.p,x:f.x+(to.x-f.x)*e,y:f.y+(to.y-f.y)*e,r:f.r+(to.r-f.r)*e};});}

  }

  _uzl(){document.getElementById(this.zoomId).textContent=`×${this.zoom.toFixed(1)}`;}
  _onRotate(dx,dy){this.viewTilt=Math.max(0,Math.min(Math.PI/2,this.viewTilt+dy*0.015));document.getElementById('angle-display').textContent=((this.viewTilt*180/Math.PI)).toFixed(0)+'°';}
